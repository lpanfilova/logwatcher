version: "3.9"

services:
  backend-api:
    build: ./backend
    container_name: backend-api
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
    depends_on:
      - opensearch
  demo-app:
    build:
      context: ./demo-app
    container_name: demo-app
    environment:
      PORT: 8888
      LOG_LEVEL: info
    ports:
      - "8888:8888"
  test-backend:
    build: ./backend_ingest_test
    container_name: test-backend
    ports:
      - "8001:8001"
  agent:
    build: ./agent
    container_name: log_forwarding_agent
    environment:
      CONFIG_PATH: "/etc/agent/config.yaml"
    volumes:
      - ./agent/config.yaml:/etc/agent/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - demo-app

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"

